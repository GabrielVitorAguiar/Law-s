<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jurisprudências</title>

  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <div class="crud-container">

    <h1>Jurisprudências</h1>

    <form id="jurisForm">

      <input
        type="text"
        id="titulo"
        placeholder="Título"
        required
      >

      <input
        type="text"
        id="tribunal"
        placeholder="Tribunal"
        required
      >

      <textarea
        id="descricao"
        placeholder="Descrição"
        required
      ></textarea>

      <button type="submit">
        Salvar
      </button>

    </form>

    <div id="listaJurisprudencias"></div>

  </div>

  <script type="module" src="js/jurisprudencias.js"></script>

</body>
</html>

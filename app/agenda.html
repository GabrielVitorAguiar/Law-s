<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <div class="crud-container calendario-container">

    <a class="home-btn icon-btn" href="index.html" aria-label="Voltar para a home">
      <span class="material-icons">home</span>
    </a>

    <h1>Calendário</h1>

    <div class="calendario-header">
      <button type="button" id="mesAnterior" class="icon-btn home-btn" aria-label="Mês anterior">
        <span class="material-icons">chevron_left</span>
      </button>

      <h2 id="mesAtual"></h2>

      <button type="button" id="mesProximo" class="icon-btn home-btn" aria-label="Próximo mês">
        <span class="material-icons">chevron_right</span>
      </button>
    </div>

    <div class="calendario-grid" id="calendarioGrid"></div>

    <section class="perfil-section">
      <h2 id="tituloDiaSelecionado">Novo registro</h2>

      <form id="agendaForm">

        <input
          type="text"
          id="titulo"
          placeholder="Título"
          required
        >

        <select id="tipo" required>
          <option value="compromisso">Compromisso</option>
          <option value="lembrete">Lembrete</option>
          <option value="anotacao">Anotação</option>
        </select>

        <select id="clienteId">
          <option value="">Sem cliente vinculado</option>
        </select>

        <input
          type="date"
          id="data"
          required
        >

        <input
          type="time"
          id="hora"
          required
        >

        <textarea
          id="descricao"
          placeholder="Detalhes"
          required
        ></textarea>

        <button type="submit">
          Salvar
        </button>

        <button type="button" id="cancelarEdicao" class="secondary-btn" hidden>
          Cancelar edição
        </button>

      </form>
    </section>

    <section class="perfil-section">
      <h2>Próximos registros</h2>
      <div id="listaEventos"></div>
    </section>

  </div>

  <script type="module" src="js/agenda.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clientes</title>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <div class="crud-container clientes-container">

    <a class="home-btn icon-btn" href="index.html" aria-label="Voltar para a home">
      <span class="material-icons">home</span>
    </a>

    <h1>Clientes</h1>

    <div class="clientes-toolbar">
      <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar por nome, CPF, telefone, RG..."
      >

      <button type="button" id="novoClienteBtn" class="primary-btn">
        Adicionar novo cliente
      </button>
    </div>

    <form id="clienteForm" class="cliente-form" hidden>

      <input
        type="text"
        id="nome"
        placeholder="Nome"
        required
      >

      <input
        type="text"
        id="cpf"
        placeholder="CPF"
        required
      >

      <input
        type="text"
        id="rg"
        placeholder="RG"
        required
      >

      <input
        type="text"
        id="telefone"
        placeholder="Telefone"
        required
      >

      <button type="submit">
        Salvar cliente
      </button>

      <button type="button" id="cancelarCadastro" class="secondary-btn">
        Cancelar
      </button>

    </form>

    <div id="listaClientes" class="clientes-lista"></div>

  </div>

  <nav id="alfabetoNav" class="alfabeto-nav" aria-label="Navegação por letras"></nav>

  <script type="module" src="./js/clientes.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Law's</title>

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <div class="overlay">
    <div class="modal">

      <h2>Entrar</h2>

      <button id="loginBtn" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="google-icon">
      Continuar com Google
      </button>

      <button id="githubBtn" class="google-btn">
    <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" class="google-icon">
      Continuar com GitHub
      </button>

      <div class="divider">ou</div>

      <a class="client-access-btn" href="portal-cliente.html">
        Sou cliente
      </a>


    </div>
  </div>

  <script type="module">
  import { auth } from "./js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "index.html";
    }
  });
</script>

  <script type="module" src="js/login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processos</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="processos-page">

  <div class="crud-container processos-shell">

    <div class="page-actions">
      <a class="home-btn icon-btn" href="index.html" aria-label="Voltar para a home">
        <span class="material-icons">home</span>
      </a>

      <a class="home-btn icon-btn" id="voltarListaProcessos" href="processos.html" aria-label="Voltar para processos" hidden>
        <span class="material-icons">arrow_back</span>
      </a>

      <button class="home-btn icon-btn notification-button" id="notificacoesBtn" type="button" aria-label="Notificações">
        <span class="material-icons">notifications</span>
        <span id="notificacoesBadge" class="notification-badge" hidden>0</span>
      </button>
    </div>

    <section id="painelNotificacoes" class="notification-panel" hidden>
      <h2>Notificações não lidas</h2>
      <div id="listaNotificacoes"></div>
    </section>

    <header class="processos-hero">
      <div>
        <p>GESTÃO JURÍDICA</p>
        <h1>Processos</h1>
        <span>Organize informações, acompanhe movimentações e centralize documentos.</span>
      </div>
      <span class="material-icons processos-hero-icon">folder_special</span>
    </header>

    <div class="clientes-toolbar" id="processosToolbar">
      <label class="process-search-field">
        <span class="material-icons">search</span>
        <input type="text" id="pesquisa" placeholder="Buscar processo, cliente, área ou status">
      </label>

      <button type="button" id="novoProcessoBtn" class="primary-btn">
        <span class="material-icons">add</span>
        Adicionar processo
      </button>
    </div>

    <form id="processoForm" class="processos-form-card" hidden>
      <div class="processos-form-heading"><span class="material-icons">edit_note</span><div><h2>Dados do processo</h2><p>Preencha os dados essenciais para manter o histórico organizado.</p></div></div>

      <div class="processos-form-grid">
        <label>Número do processo
          <input type="text" id="numero" placeholder="Número do processo" required>
        </label>

        <label>Cliente
          <select id="clienteId" required><option value="">Selecione o cliente</option></select>
        </label>

        <label>Área
          <input type="text" id="area" placeholder="Ex.: Trabalhista" required>
        </label>

        <label>Status
          <input type="text" id="status" placeholder="Ex.: Em andamento" required>
        </label>
      </div>

      <label>Descrição<textarea id="descricao" placeholder="Adicione um resumo ou informações relevantes" required></textarea></label>

      <label class="file-field">
        <span>Anexo do processo (.pdf, .doc ou .docx)</span>
        <input
          type="file"
          id="arquivo"
          accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        >
      </label>

      <div id="arquivoAtual" class="arquivo-atual"></div>

      <div class="processos-form-actions"><button type="button" id="cancelarEdicao" class="secondary-btn">Cancelar</button><button type="submit" class="primary-btn"><span class="material-icons">save</span>Salvar processo</button></div>

    </form>

    <div id="listaProcessos"></div>

  </div>

  <script type="module" src="./js/processos.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

  <div class="crud-container">

    <a class="home-btn icon-btn" href="index.html" aria-label="Voltar para a home">
      <span class="material-icons">home</span>
    </a>

    <h1>Calendário</h1>

    <input
      type="text"
      id="pesquisa"
      placeholder="Pesquisar compromisso..."
    >

    <form id="agendaForm">

      <input
        type="text"
        id="titulo"
        placeholder="Título do compromisso"
        required
      >

      <input
        type="date"
        id="data"
        required
      >

      <input
        type="time"
        id="hora"
        required
      >

      <textarea
        id="descricao"
        placeholder="Descrição"
        required
      ></textarea>

      <button type="submit">
        Salvar
      </button>

      <button type="button" id="cancelarEdicao" class="secondary-btn" hidden>
        Cancelar edição
      </button>

    </form>

    <div id="listaEventos"></div>

  </div>

  <script type="module" src="js/agenda.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Law's</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<script type="module">
  import { auth } from "./js/firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    } else {
      console.log("Usuário logado:", user);
    }
  });
</script>

<div class="menu">

  <div class="menu-item" onclick="goTo('clientes.html')" aria-label="Abrir clientes">
    <span class="material-icons">groups</span>
    <span class="menu-label">Clientes</span>
  </div>

  <div class="menu-item" onclick="goTo('jurisprudencias.html')" aria-label="Abrir jurisprudências">
    <span class="material-icons">gavel</span>
    <span class="menu-label">Jurisprudências</span>
  </div>

  <div class="menu-item" onclick="goTo('agenda.html')" aria-label="Abrir calendário">
    <span class="material-icons">calendar_month</span>
    <span class="menu-label">Calendário</span>
  </div>

  <div class="menu-item" onclick="goTo('processos.html')" aria-label="Abrir processos">
    <span class="material-icons">folder</span>
    <span class="menu-label">Processos</span>
  </div>

</div>

<div class="recentes-container">

  <h2>Recentes</h2>

  <div class="recentes-carousel">
    <button type="button" id="recentesAnterior" class="carousel-btn" aria-label="Ver recentes anteriores">
      <span class="material-icons">chevron_left</span>
    </button>

    <div id="recentes"></div>

    <button type="button" id="recentesProximo" class="carousel-btn" aria-label="Ver mais recentes">
      <span class="material-icons">chevron_right</span>
    </button>
  </div>

</div>

<script>
  function goTo(page) {
    window.location.href = page;
  }
</script>

<script type="module" src="./js/recentes.js"></script>

</body>
</html>

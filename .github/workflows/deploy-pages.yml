name: Publicar frontend no GitHub Pages

on:
  push:
    branches:
      - dev
    paths:
      - "app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./app
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
